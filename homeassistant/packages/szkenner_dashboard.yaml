title: Szkenner & Nyomtató
views:
- title: Vezérlés
  path: vezerles
  icon: mdi:printer-scanner
  cards:
  - type: custom:mushroom-template-card
    primary: Epson XP-610 Papírdigitalizáló
    secondary: '{% set st = states("sensor.paperless_szkenner_puffer") %}{% if st
      in ["Üres", "0 oldal", "unavailable", "unknown"] %}Puffer üres · Készen áll
      a szkennelésre{% else %}Pufferben: {{ st }} · Összefűzésre vár!{% endif %}'
    icon: mdi:scanner
    icon_color: '{% set st = states("sensor.paperless_szkenner_puffer") %}{% if st
      not in ["Üres", "0 oldal", "unavailable", "unknown"] %}orange{% else %}green{%
      endif %}'
    layout: horizontal
    tap_action:
      action: url
      url_path: http://192.168.0.32:8010/
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:mushroom-template-card
      layout: vertical
      primary: Befejezés
      secondary: Összefűzés & Küldés
      icon: mdi:file-check
      icon_color: green
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.paperless_dokumentum_lezarasa
    - type: custom:mushroom-template-card
      layout: vertical
      primary: Mégse
      secondary: Puffer kiürítése
      icon: mdi:trash-can-outline
      icon_color: red
      tap_action:
        action: call-service
        service: input_button.press
        confirmation:
          text: Biztosan törölni szeretnéd a beolvasott, összefűzetlen oldalakat a
            pufferből?
        target:
          entity_id: input_button.paperless_puffer_uritese
  - type: entities
    title: 🖨️ Szkenner & Puffer Állapot
    show_header_toggle: false
    entities:
    - entity: sensor.paperless_szkenner_puffer
      name: Pufferelt oldalak száma
      icon: mdi:layers-outline
    - entity: input_button.paperless_dokumentum_lezarasa
      name: Dokumentum lezárása és beküldése
      icon: mdi:file-check
    - entity: input_button.paperless_puffer_uritese
      name: Puffer törlése (Mégse)
      icon: mdi:trash-can-outline
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:mushroom-template-card
      layout: horizontal
      primary: Paperless-ngx
      secondary: Dokumentumtár (8010)
      icon: mdi:file-document-multiple-outline
      icon_color: blue
      tap_action:
        action: url
        url_path: http://192.168.0.32:8010/
    - type: custom:mushroom-template-card
      layout: horizontal
      primary: Epson XP-610
      secondary: Web Config (.90)
      icon: mdi:printer
      icon_color: purple
      tap_action:
        action: url
        url_path: http://192.168.0.90/
  - type: markdown
    title: 📖 Szkennelési Útmutató
    content: '### 📄 Többoldalas dokumentum szkennelése:

      1. Helyezd a lapot a síkágyra.

      2. A nyomtató kijelzőjén válaszd: **`+ Oldal hozzaad`**.

      3. A következő oldalaknál szintén nyomd meg a **`+ Oldal hozzaad`** opciót.

      4. Az utolsó oldalnál válaszd a **`KESZ Utolso lap`** menüpontot a nyomtatón
      (vagy nyomd meg a fenti zöld **Befejezés** gombot).

      5. A rendszer automatikusan összefűzi és továbbítja a Paperless-be!


      ---

      ### ⚡ Egyoldalas azonnali szkennelés:

      * A nyomtató kijelzőjén válaszd: **`1 oldal Azonnal`**.

      * Az oldal azonnal bekerül a Paperless-be és elindul az AI feldolgozás.


      ---

      ### 🏷️ Irattári Sorszámozás (ASN):

      * Minden Epson-nal beolvasott fizikai papír automatikusan kap egy növekvő **#ASN
      sorszámot**.

      * Ezt írd rá a papírra ceruzával, és tedd a fizikai dossziéba!

      * Az e-mailben érkező digitális számlák nem kapnak sorszámot.'
